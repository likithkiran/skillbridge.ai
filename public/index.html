<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillBridge AI - Ultimate Career & Skill Learning Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --panel: #131b2e;
      --panel-alt: #1a243b;
      --cyan: #00f2fe;
      --mint: #4facfe;
      --gold: #ffb703;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

    body {
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 5%;
      border-bottom: 1px solid var(--border);
      background: rgba(11, 15, 25, 0.8);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--cyan), var(--mint));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .ai-btn {
      background: linear-gradient(135deg, var(--cyan), var(--mint));
      color: #000;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .ai-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
    }

    /* Main Container */
    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .hero {
      text-align: center;
      margin-bottom: 50px;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .hero p {
      color: var(--muted);
      font-size: 18px;
    }

    /* Slide Out Drawer for AI Assistant */
    .ai-drawer {
      position: fixed;
      top: 0;
      right: -420px;
      width: 400px;
      height: 100vh;
      background: var(--panel);
      border-left: 1px solid var(--border);
      box-shadow: -10px 0 30px rgba(0,0,0,0.5);
      transition: right 0.3s ease;
      z-index: 1000;
      display: flex;
      flex-direction: column;
    }

    .ai-drawer.open {
      right: 0;
    }

    .ai-header {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ai-header h3 { color: var(--cyan); }

    .close-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 24px;
      cursor: pointer;
    }

    .ai-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .msg-user {
      align-self: flex-end;
      background: rgba(0, 242, 254, 0.12);
      border: 1px solid var(--cyan);
      padding: 12px 16px;
      border-radius: 8px;
      max-width: 85%;
    }

    .msg-ai {
      align-self: flex-start;
      background: var(--panel-alt);
      border: 1px solid var(--border);
      padding: 12px 16px;
      border-radius: 8px;
      max-width: 85%;
    }

    .msg-ai strong { color: var(--gold); }
    .msg-ai pre { background: #080d1a; padding: 10px; border-radius: 6px; overflow-x: auto; margin-top: 8px; }

    .ai-input-area {
      padding: 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
    }

    .ai-input-area input {
      flex: 1;
      background: var(--panel-alt);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px;
      border-radius: 6px;
      outline: none;
    }

    .ai-input-area button {
      background: var(--cyan);
      color: #000;
      border: none;
      padding: 0 18px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">SkillBridge AI</div>
    <button class="ai-btn" onclick="toggleDrawer()">🤖 Ask Smart AI Mentor</button>
  </header>

  <div class="container">
    <div class="hero">
      <h1>Elevate Your Career with AI</h1>
      <p>Interactive roadmaps, skill tracking, and AI-powered mentorship in one place.</p>
    </div>
  </div>

  <!-- AI Mentor Drawer -->
  <div class="ai-drawer" id="ai-drawer">
    <div class="ai-header">
      <h3>🤖 Smart AI Mentor</h3>
      <button class="close-btn" onclick="toggleDrawer()">&times;</button>
    </div>
    <div class="ai-messages" id="ai-msg-container">
      <div class="msg-ai">
        Hello! I'm your Smart AI Mentor. Ask me anything about programming, career roadmaps, or learning new technical skills!
      </div>
    </div>
    <div class="ai-input-area">
      <input type="text" id="ai-user-input" placeholder="Type your question..." onkeypress="handleKeyPress(event)" />
      <button onclick="sendAiMessage()">Send</button>
    </div>
  </div>

  <script>
    function toggleDrawer() {
      document.getElementById('ai-drawer').classList.toggle('open');
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendAiMessage();
    }

    async function sendAiMessage() {
      const input = document.getElementById('ai-user-input');
      const text = input.value.trim();
      if (!text) return;

      const container = document.getElementById('ai-msg-container');
      container.innerHTML += `<div class="msg-user">${text}</div>`;
      input.value = '';
      container.scrollTop = container.scrollHeight;

      const loadingId = 'loading-' + Date.now();
      container.innerHTML += `<div class="msg-ai" id="${loadingId}"><em>🤖 Smart AI Mentor is thinking...</em></div>`;
      container.scrollTop = container.scrollHeight;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });

        const data = await res.json();
        const loadingElem = document.getElementById(loadingId);

        let aiReply = data.reply || "No response received.";
        
        // Format code blocks
        aiReply = aiReply
          .replace(/```(\w+)?\n([\s\S]*?)```/g, (match, lang, code) => `<pre><code>${code.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</code></pre>`)
          .replace(/\n/g, '<br/>');

        loadingElem.innerHTML = `<strong>Smart AI Assistant:</strong><br/><br/>${aiReply}`;
      } catch (err) {
        console.error(err);
        const loadingElem = document.getElementById(loadingId);
        if (loadingElem) loadingElem.innerHTML = "Error connecting to AI service.";
      }

      container.scrollTop = container.scrollHeight;
    }
  </script>
</body>
</html>
